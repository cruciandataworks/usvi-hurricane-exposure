# Runs the whole pipeline every 3 hours. NHC issues advisories every 6 hours (every 3
# when watches are up), so a 3-hour cycle catches each new forecast. Outside hurricane
# season a run takes about 2 minutes and finds no active storms.
#
# Where the data lives between runs (none of it is in git): the whole Parquet lake,
# including the raw downloads, is one file on a GitHub release called "lake". It is
# downloaded at the start and uploaded again at the end. If it is ever deleted, the
# next run rebuilds HURDAT2 and the Census from NOAA and the Census Bureau; only the
# saved history of live forecasts would be lost.
#
# Cost: about 2 minutes per run, 8 runs a day. Free and unlimited in a public repository.
name: Hurricane exposure refresh

on:
  schedule:
    - cron: "41 */3 * * *"   # 00:41, 03:41 ... UTC (GitHub may start runs a few minutes late)
  workflow_dispatch:
    inputs:
      test_failure:
        description: "Fail on purpose to test the failure alert"
        type: boolean
        default: false
      chained:
        description: "Started by the previous run (the backup for GitHub's scheduler)"
        type: boolean
        default: false

permissions:
  contents: write   # upload the lake to the release, daily data commit
  issues: write     # alert issues
  actions: write    # start the next run when GitHub's scheduler is not firing


jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:      # never let two runs write the lake at the same time
      group: refresh
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}   # empty until the secret exists
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the lake from the "lake" release
        run: |
          if gh release download lake --pattern lake.tar.gz --dir /tmp 2>/dev/null; then
            tar -xzf /tmp/lake.tar.gz
            echo "Restored lake: $(du -sh lake | cut -f1)"
          else
            echo "::warning::No lake release found - rebuilding from NOAA and the Census Bureau."
          fi

      - name: Unit tests (parsers, no network)
        run: python tests/test_pipeline.py

      - name: Run pipeline (HURDAT2, Census, active storms, load, dbt build, export, alerts)
        env:
          TEST_FAILURE: ${{ inputs.test_failure }}
          ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE }}
        run: python run_pipeline.py

      - name: Upload the lake back to the release
        run: |
          tar -czf /tmp/lake.tar.gz lake
          gh release view lake >/dev/null 2>&1 || \
            gh release create lake --title "Data lake (auto-updated)" \
              --notes "HURDAT2, Census and every saved NHC forecast (Parquet), plus the raw downloads. Replaced every run."
          gh release upload lake /tmp/lake.tar.gz --clobber

      # GitHub pauses scheduled workflows in repositories with no commits for 60 days.
      # One small commit a day (the first automatic run of the day, or any manual run) prevents that.
      - name: Daily data commit
        run: |
          # scheduled and chained runs commit only once a day; manual runs always do
          if [ "${{ github.event_name == 'schedule' || inputs.chained == true }}" = "true" ] && \
             [ "$(git log -1 --author=cdw-bot --format=%cd --date=format:%F)" = "$(date -u +%F)" ]; then exit 0; fi
          git config user.name "cdw-bot"
          git config user.email "hello@cruciandataworks.com"
          git add dashboard/data/summary.json dashboard/data/estates.geojson
          git diff --cached --quiet || git commit -m "Daily hurricane exposure snapshot"
          git push

      # Publish the refreshed dashboard to cruciandataworks.com (Hostinger) over FTP.
      # Skipped until the FTP secrets are added in Settings > Secrets and variables > Actions.
      - name: Upload dashboard to Hostinger
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dashboard/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/projects/hurricane-exposure/' }}

      - name: Alert on failure
        if: ${{ failure() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || 'OrlandoSpears' }}
        run: |
          gh label create refresh-failure --color C8553D --description "Scheduled refresh failed" 2>/dev/null || true
          body="The hurricane exposure refresh failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run log: $RUN_URL

          The website still shows the last good data. Close this issue once the cause is fixed."
          open=$(gh issue list --label refresh-failure --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Hurricane exposure refresh failed" --label refresh-failure --assignee "$ASSIGNEE" --body "$body"
          fi

  # Backup for GitHub's scheduler, which can take a long time to start firing in a new
  # repository and sometimes drops runs. This small job waits until 3 hours after the
  # refresh began, then starts the next run, unless any newer run of this workflow has
  # started in the meantime (a scheduled run, a manual run or another chain). So there is
  # only ever one chain, and once the schedule fires, the chain stops by itself.
  # It runs in its own job so the wait never blocks other runs. Waiting uses free runner
  # time in a public repository. Set the repository variable CHAIN_RUNS to "false" to
  # turn this off.
  next-run:
    needs: refresh
    if: ${{ !cancelled() && vars.CHAIN_RUNS != 'false' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait, then start the next run if nothing newer has started
        run: |
          started=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          wait=$(( $(date -u -d "$started" +%s) + 10800 - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then echo "Waiting ${wait}s"; sleep "$wait"; fi
          newer=$(gh run list --workflow refresh.yml --created ">$started" --json databaseId \
                  -q '[.[] | select(.databaseId != ${{ github.run_id }})] | length')
          if [ "$newer" != "0" ]; then echo "A newer run has started; it carries on from here."; exit 0; fi
          gh workflow run refresh.yml --ref ${{ github.ref_name }} -f chained=true
          echo "Started the next run."
